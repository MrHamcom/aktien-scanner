# Exchange names as they appear in the iShares holdings file -> Yahoo Finance ticker format.
# Matching ignores case and surrounding spaces. Unmapped exchanges are reported in the UI
# (page "Datenqualität") so this list can be completed after the first ramp-up run.
#
# suffix:            appended to the ticker (e.g. ".DE")
# zero_pad:          left-pad numeric tickers with zeros to this length (e.g. Hong Kong 700 -> 0700)
# separator:         replacement for "/" and "." inside the ticker (US: BRK.B -> BRK-B)
# by_country:        suffix depending on the "Location" column (for shared exchange names)
# ticker_map:        exchange-specific ticker -> Yahoo symbol (without suffix)
# strip_suffixes:    endings removed from the ticker (Thailand NVDR "ADVANC-R" -> ordinary share)

# Holdings without a stock exchange listing (e.g. suspended or delisted securities).
# They are excluded from the universe with reason "unlisted", not reported as unmapped.
unlisted:
  - "NO MARKET (E.G. UNLISTED)"
  - "-"
  - "Standard-Classica-Forts"  # Moscow Exchange: not tradable for foreign investors, no data

exchanges:
  # North America
  "New York Stock Exchange Inc.": {suffix: "", separator: "-"}
  "NYSE": {suffix: "", separator: "-"}
  "NASDAQ": {suffix: "", separator: "-"}
  "Nasdaq": {suffix: "", separator: "-"}
  "NYSE Arca": {suffix: "", separator: "-"}
  "Nyse Mkt Llc": {suffix: "", separator: "-"}
  "Cboe BZX formerly known as BATS": {suffix: "", separator: "-"}
  "Cboe BZX": {suffix: "", separator: "-"}
  "Toronto Stock Exchange": {suffix: ".TO", separator: "-"}

  # Europe
  "London Stock Exchange": {suffix: ".L", separator: "-"}
  "Xetra": {suffix: ".DE"}
  "Deutsche Boerse Xetra": {suffix: ".DE"}
  "Nyse Euronext - Euronext Paris": {suffix: ".PA"}
  "Euronext Paris": {suffix: ".PA"}
  "Euronext Amsterdam": {suffix: ".AS"}
  "Nyse Euronext - Euronext Brussels": {suffix: ".BR"}
  "Euronext Brussels": {suffix: ".BR"}
  "Nyse Euronext - Euronext Lisbon": {suffix: ".LS"}
  "Irish Stock Exchange - All Market": {suffix: ".IR"}
  "Borsa Italiana": {suffix: ".MI"}
  "Bolsa De Madrid": {suffix: ".MC"}
  "SIX Swiss Exchange": {suffix: ".SW"}
  "Six Swiss Exchange": {suffix: ".SW"}
  "Oslo Bors Asa": {suffix: ".OL"}
  "Wiener Boerse Ag": {suffix: ".VI"}
  "Omx Nordic Exchange Copenhagen A/S": {suffix: ".CO", separator: "-"}
  "Nasdaq Omx Helsinki Ltd.": {suffix: ".HE"}
  "Nasdaq Omx Nordic":
    by_country: {Sweden: ".ST", Finland: ".HE", Denmark: ".CO"}
    separator: "-"
  "Tel Aviv Stock Exchange": {suffix: ".TA"}

  # Asia Pacific
  "Tokyo Stock Exchange": {suffix: ".T"}
  "Hong Kong Exchanges And Clearing Ltd": {suffix: ".HK", zero_pad: 4}
  "Singapore Exchange": {suffix: ".SI"}
  "Asx - All Markets": {suffix: ".AX"}
  "New Zealand Exchange Ltd": {suffix: ".NZ"}

  # Emerging markets
  "Korea Exchange (Stock Market)": {suffix: ".KS", zero_pad: 6}
  "Korea Exchange (Kosdaq)": {suffix: ".KQ", zero_pad: 6}
  "Taiwan Stock Exchange": {suffix: ".TW"}
  "Gretai Securities Market": {suffix: ".TWO"}
  "Shanghai Stock Exchange": {suffix: ".SS", zero_pad: 6}
  "Shenzhen Stock Exchange": {suffix: ".SZ", zero_pad: 6}
  "National Stock Exchange Of India": {suffix: ".NS", separator: "-"}
  "Bombay Stock Exchange": {suffix: ".BO", separator: "-"}
  "Bse Ltd": {suffix: ".BO", separator: "-"}
  "XBSP": {suffix: ".SA"}
  "Bolsa De Valores De Sao Paulo": {suffix: ".SA"}
  "Bolsa Mexicana De Valores": {suffix: ".MX"}
  "Johannesburg Stock Exchange": {suffix: ".JO"}
  "Saudi Stock Exchange": {suffix: ".SR"}
  "Qatar Exchange": {suffix: ".QA"}
  "Kuwait Stock Exchange": {suffix: ".KW"}
  "Indonesia Stock Exchange": {suffix: ".JK"}
  "Stock Exchange Of Thailand": {suffix: ".BK", strip_suffixes: ["-R", ".R"]}
  # Yahoo lists Malaysian shares by stock code, iShares by short name -> explicit table.
  # Codes checked against Yahoo's KLSE component list on 25.11.2026.
  "Bursa Malaysia":
    suffix: ".KL"
    ticker_map:
      CDB: "6947"      # CelcomDigi
      GAMUDA: "5398"
      IHH: "5225"      # IHH Healthcare
      KLK: "2445"      # Kuala Lumpur Kepong
      MAXIS: "6012"
      MISC: "3816"
      PCHEM: "5183"    # PETRONAS Chemicals
      PETGAS: "6033"   # PETRONAS Gas
      PMETAL: "8869"   # Press Metal
      SDG: "5285"      # SD Guthrie
      SWB: "5211"      # Sunway
      TENAGA: "5347"   # Tenaga Nasional
      TM: "4863"       # Telekom Malaysia
      YTLPOWR: "6742"  # YTL Power
  "Philippine Stock Exchange Inc.": {suffix: ".PS"}
  "Warsaw Stock Exchange/Equities/Main Market": {suffix: ".WA"}
  "Istanbul Stock Exchange": {suffix: ".IS", strip_suffixes: [".E"]}
  "Santiago Stock Exchange": {suffix: ".SN", separator: "-"}
  "Athens Exchange": {suffix: ".AT"}
  "Athens Exchange S.A. Cash Market": {suffix: ".AT"}
  "Dubai Financial Market": {suffix: ".AE"}
  "Bolsa De Valores De Colombia": {suffix: ".CL"}
  "Egyptian Exchange": {suffix: ".CA"}
  # "Abu Dhabi Securities Exchange": deliberately not mapped – Yahoo lists no suffix for it
  # (help.yahoo.com SLN2310, checked 24.11.2026); a guessed suffix could match a different company.
  "Budapest Stock Exchange": {suffix: ".BD"}
  "Prague Stock Exchange": {suffix: ".PR"}

# Ticker spellings that cannot be derived by rule (holdings ticker -> Yahoo ticker)
ticker_overrides:
  BRKB: BRK-B
  BFB: BF-B
